name: Weekly NFL data and model refresh

on:
  schedule:
    # Every Tuesday 17:17 UTC (12:17pm EST / 1:17pm EDT).
    # Follows Monday Night Football and the nflverse schedule update cycle.
    - cron: '17 17 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-nfl-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python libraries
        run: python -m pip install -r requirements.txt
      - name: Download NFL scores, verify coverage, retrain if changed
        run: python scripts/weekly_refresh.py
      - name: Run automated tests
        run: python -m pytest -q
      - name: Commit verified data and model files only
        shell: bash
        run: |
          git add -- data/nfl_games.csv artifacts/model.joblib artifacts/evaluation.json artifacts/backtest.csv
          if git diff --cached --quiet; then
            echo 'No verified game or model changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update verified NFL results and retrain predictions [weekly]'
          git push origin HEAD:main
